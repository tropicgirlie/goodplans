name: GoodPlans
options:
  bundleIdPrefix: systems.luana
  deploymentTarget:
    iOS: "17.0"
packages:
  GoodPlansCore:
    path: ../GoodPlansCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  GoodPlans:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: GoodPlansCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.luana.goodplans.prototype
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Us & About
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCalendarsWriteOnlyAccessUsageDescription: Add a plan to your calendar when you choose. Us & About does not read your calendar.
        CFBundleURLTypes:
          - CFBundleURLName: systems.luana.goodplans.prototype
            CFBundleURLSchemes: [goodplans-preview]
schemes:
  GoodPlans:
    build:
      targets:
        GoodPlans: all
