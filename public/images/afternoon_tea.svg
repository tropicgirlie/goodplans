<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="teaPaperPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#FFFDE7"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FFF59D" stroke-width="1.5"/>
    </pattern>
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#2C221E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#teaPaperPattern)" />

  <rect x="340" y="15" width="120" height="28" fill="#F9E076" opacity="0.85" transform="rotate(-1 400 30)"/>

  <!-- Champagne Coupe Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(160, 60) rotate(-5)">
    <rect x="-10" y="-10" width="160" height="240" rx="20" fill="#FFFFFF"/>
    <path d="M 30 50 C 30 130, 110 130, 110 50 Z" fill="#FFF9C4" stroke="#F9E076" stroke-width="4"/>
    <line x1="70" y1="120" x2="70" y2="200" stroke="#F9E076" stroke-width="8"/>
    <ellipse cx="70" cy="200" rx="40" ry="10" fill="#F9E076"/>
    <!-- Champagne bubbles -->
    <circle cx="55" cy="80" r="4" fill="#FFFFFF"/>
    <circle cx="75" cy="70" r="5" fill="#FFFFFF"/>
    <circle cx="85" cy="90" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Porcelain Teapot & Teacups Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(360, 80) rotate(4)">
    <rect x="-10" y="-10" width="300" height="220" rx="20" fill="#FFFFFF"/>
    <!-- Teapot -->
    <ellipse cx="140" cy="120" rx="70" ry="55" fill="#FFF0F2" stroke="#C85A65" stroke-width="4"/>
    <path d="M 200 100 C 240 80, 240 140, 200 140" fill="none" stroke="#C85A65" stroke-width="8"/>
    <path d="M 70 110 L 30 80" fill="none" stroke="#C85A65" stroke-width="10" stroke-linecap="round"/>
    <circle cx="140" cy="55" r="14" fill="#C85A65"/>
    <text x="105" y="128" font-family="Caveat, cursive" font-size="22" font-weight="bold" fill="#C85A65">Shelbourne</text>
  </g>

  <!-- Scones & Jam Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(180, 320) rotate(3)">
    <rect x="-10" y="-10" width="440" height="180" rx="20" fill="#FFFFFF"/>
    <!-- Scones -->
    <circle cx="80" cy="90" r="45" fill="#E0D4C5" stroke="#9E8E87" stroke-width="3"/>
    <circle cx="200" cy="90" r="45" fill="#E0D4C5" stroke="#9E8E87" stroke-width="3"/>
    <!-- Clotted cream & Jam -->
    <circle cx="320" cy="80" r="30" fill="#FFFFFF" stroke="#E0D4C5" stroke-width="4"/>
    <circle cx="380" cy="100" r="28" fill="#C85A65"/>
  </g>

  <g transform="translate(240, 510)">
    <rect x="0" y="0" width="340" height="60" rx="12" fill="#FFFFFF" opacity="0.95"/>
    <text x="20" y="36" font-family="Caveat, cursive" font-size="24" font-weight="bold" fill="#C85A65">Shelbourne Tea &amp; Pamper 💕</text>
  </g>
</svg>
