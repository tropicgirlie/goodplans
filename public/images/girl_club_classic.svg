<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Ribbed Cream Paper Texture -->
    <pattern id="paperPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#FAF6F0"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#F3ECE0" stroke-width="1.5"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="#F8F2E8" stroke-width="1"/>
    </pattern>

    <!-- Sticker Drop Shadow -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#2C221E" flood-opacity="0.18"/>
    </filter>
    
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#2C221E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Ribbed Paper -->
  <rect width="800" height="600" fill="url(#paperPattern)" />

  <!-- Outer Washi Tape -->
  <rect x="340" y="15" width="120" height="28" fill="#F9E076" opacity="0.85" transform="rotate(-2 400 30)"/>

  <!-- Sticker 1: Red Rotary Phone Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(180, 50) rotate(-6)">
    <rect x="-10" y="-10" width="130" height="130" rx="20" fill="#FFFFFF"/>
    <path d="M 20 60 C 20 20, 90 20, 90 60 C 90 90, 20 90, 20 60 Z" fill="#C85A65"/>
    <circle cx="55" cy="55" r="28" fill="#FAF6F0" stroke="#C85A65" stroke-width="4"/>
    <circle cx="55" cy="40" r="5" fill="#2C221E"/>
    <circle cx="70" cy="55" r="5" fill="#2C221E"/>
    <circle cx="55" cy="70" r="5" fill="#2C221E"/>
    <circle cx="40" cy="55" r="5" fill="#2C221E"/>
    <path d="M 10 30 Q 55 5 100 30" fill="none" stroke="#A83B46" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Sticker 2: Pink Velvet Ribbon Bow -->
  <g filter="url(#stickerShadow)" transform="translate(360, 70) rotate(8)">
    <path d="M 0 0 C -30 -30, -50 0, 0 10 C 50 0, 30 -30, 0 0 Z" fill="#F7B7A3" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M -10 10 L -30 60 L 0 20 L 30 60 L 10 10 Z" fill="#F7B7A3" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="0" cy="5" r="8" fill="#C85A65" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Sticker 3: Ticket to Club Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(500, 40) rotate(12)">
    <rect x="0" y="0" width="180" height="90" rx="10" fill="#F7B7A3" stroke="#FFFFFF" stroke-width="6"/>
    <line x1="40" y1="0" x2="40" y2="90" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="6,6"/>
    <circle cx="40" cy="0" r="10" fill="#FAF6F0"/>
    <circle cx="40" cy="90" r="10" fill="#FAF6F0"/>
    <text x="60" y="42" font-family="Playfair Display, Georgia, serif" font-size="18" font-weight="bold" fill="#C85A65">TICKET TO</text>
    <text x="60" y="66" font-family="Caveat, cursive" font-size="26" font-weight="bold" fill="#2C221E">The Girl Club</text>
  </g>

  <!-- Sticker 4: FLAWLESS Bubble Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(540, 160) rotate(-4)">
    <path d="M 10 30 Q 80 0 190 20 Q 220 50 200 80 Q 120 100 20 80 Q -10 50 10 30 Z" fill="#FFFFFF"/>
    <text x="25" y="60" font-family="Outfit, sans-serif" font-size="34" font-weight="900" fill="#FF1493" letter-spacing="2">FLAWLESS</text>
  </g>

  <!-- Sticker 5: Luxury Red Handbag & Coat Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(180, 240) rotate(-3)">
    <rect x="-10" y="-10" width="220" height="200" rx="20" fill="#FFFFFF"/>
    <!-- Coat -->
    <path d="M 10 40 L 60 10 L 110 40 L 100 180 L 20 180 Z" fill="#C85A65"/>
    <path d="M 60 10 L 60 180" stroke="#A83B46" stroke-width="4"/>
    <!-- Bag -->
    <rect x="110" y="80" width="80" height="70" rx="8" fill="#A83B46"/>
    <path d="M 130 80 C 130 40, 170 40, 170 80" fill="none" stroke="#A83B46" stroke-width="8"/>
    <circle cx="150" cy="95" r="5" fill="#F9E076"/>
  </g>

  <!-- Center Sticker: The Next Big Thing Cutout Badge -->
  <g filter="url(#stickerShadow)" transform="translate(340, 310) rotate(5)">
    <path d="M 0 30 Q 100 0 220 20 Q 240 60 210 90 Q 100 110 0 80 Z" fill="#FCE4EC" stroke="#FFFFFF" stroke-width="8"/>
    <text x="35" y="48" font-family="Caveat, cursive" font-size="30" font-weight="bold" fill="#C85A65">The Next</text>
    <text x="45" y="80" font-family="Playfair Display, serif" font-size="32" font-style="italic" font-weight="bold" fill="#2C221E">Big Thing</text>
  </g>

  <!-- Sticker 6: Pink Suede Sneakers Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(60, 440) rotate(-8)">
    <rect x="-10" y="-10" width="180" height="110" rx="16" fill="#FFFFFF"/>
    <path d="M 10 60 C 20 20, 80 10, 140 40 L 160 80 L 10 80 Z" fill="#F7B7A3"/>
    <rect x="10" y="75" width="150" height="18" rx="4" fill="#E0D4C5"/>
    <circle cx="50" cy="45" r="4" fill="#FFFFFF"/>
    <circle cx="70" cy="42" r="4" fill="#FFFFFF"/>
    <circle cx="90" cy="45" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Sticker 7: Digital Camera & Cherries Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(560, 380) rotate(10)">
    <rect x="-10" y="-10" width="190" height="130" rx="18" fill="#FFFFFF"/>
    <rect x="10" y="20" width="150" height="85" rx="12" fill="#E0D4C5"/>
    <circle cx="75" cy="62" r="28" fill="#2C221E" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="75" cy="62" r="14" fill="#6C5E58"/>
    <rect x="130" y="30" width="20" height="12" fill="#F9E076"/>
    <!-- Cherries -->
    <circle cx="150" cy="100" r="10" fill="#C85A65"/>
    <circle cx="165" cy="105" r="10" fill="#C85A65"/>
    <path d="M 150 100 Q 155 80 160 75 Q 165 80 165 105" fill="none" stroke="#7B9E87" stroke-width="3"/>
  </g>

  <!-- Bottom Handwritten Quote Sticker -->
  <g transform="translate(240, 480)">
    <rect x="0" y="0" width="340" height="70" rx="12" fill="#FFFFFF" opacity="0.9" filter="url(#subtleShadow)"/>
    <text x="20" y="30" font-family="Caveat, cursive" font-size="22" font-weight="bold" fill="#2C221E">Girls Don't Cry • Amiga Girlhood 💕</text>
    <text x="20" y="52" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="600" fill="#6C5E58">Feminine style, warm routines &amp; zero friction</text>
  </g>

</svg>
