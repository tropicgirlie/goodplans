<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <!-- Desaturation Filter for Crisp B&W Editorial Portrait Base -->
    <filter id="bwEditorialFilter">
      <feColorMatrix type="matrix" values="
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0    0    0    1 0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.15" intercept="-0.08"/>
        <feFuncG type="linear" slope="1.15" intercept="-0.08"/>
        <feFuncB type="linear" slope="1.15" intercept="-0.08"/>
      </feComponentTransfer>
    </filter>

    <!-- Polka Dot Patterns for Hand-Drawn Clothes Overlays -->
    <pattern id="polkaBluePink" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#2563EB"/>
      <circle cx="12" cy="12" r="6" fill="#F43F5E"/>
    </pattern>

    <pattern id="polkaYellowBlue" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#F59E0B"/>
      <circle cx="10" cy="10" r="4.5" fill="#2563EB"/>
    </pattern>

    <!-- Striped Pattern for Inner Halo Contour -->
    <pattern id="coralStripes" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="16" stroke="#F43F5E" stroke-width="6"/>
    </pattern>

    <!-- Dot Pattern for Middle Halo Contour -->
    <pattern id="auraDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#FFFFFF"/>
      <circle cx="8" cy="8" r="4" fill="#1D4ED8"/>
    </pattern>

    <!-- Teardrop Ray Definition for Radial Pop-Art Halo -->
    <g id="teardropRay">
      <path d="M 0 -240 Q -15 -185 0 -130 Q 15 -185 0 -240 Z" />
    </g>

    <!-- Friend 1 Clip (Straight Hair Left) -->
    <clipPath id="clipFriend1">
      <path d="M 180 220 Q 280 180 340 220 L 360 620 L 160 620 Z"/>
    </clipPath>

    <!-- Friend 2 Clip (Curly Afro Center) -->
    <clipPath id="clipFriend2">
      <path d="M 370 160 Q 500 130 630 160 L 650 680 L 350 680 Z"/>
    </clipPath>

    <!-- Friend 3 Clip (Chic Braids Right) -->
    <clipPath id="clipFriend3">
      <path d="M 640 220 Q 740 180 840 220 L 860 620 L 620 620 Z"/>
    </clipPath>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1000" height="750" fill="#FAFAFA"/>

  <!-- RADIATING TEARDROP HALO (Exact Pop-Art Style from Reference Image) -->
  <g transform="translate(500, 400)">
    <use href="#teardropRay" fill="#1D4ED8" transform="rotate(-85)"/>
    <use href="#teardropRay" fill="#38BDF8" transform="rotate(-75)"/>
    <use href="#teardropRay" fill="#F43F5E" transform="rotate(-65)"/>
    <use href="#teardropRay" fill="#FB923C" transform="rotate(-55)"/>
    <use href="#teardropRay" fill="#FBCFE8" transform="rotate(-45)"/>
    <use href="#teardropRay" fill="#1D4ED8" transform="rotate(-35)"/>
    <use href="#teardropRay" fill="#F59E0B" transform="rotate(-25)"/>
    <use href="#teardropRay" fill="#F43F5E" transform="rotate(-15)"/>
    <use href="#teardropRay" fill="#38BDF8" transform="rotate(-5)"/>
    <use href="#teardropRay" fill="#1D4ED8" transform="rotate(5)"/>
    <use href="#teardropRay" fill="#FB923C" transform="rotate(15)"/>
    <use href="#teardropRay" fill="#F59E0B" transform="rotate(25)"/>
    <use href="#teardropRay" fill="#F43F5E" transform="rotate(35)"/>
    <use href="#teardropRay" fill="#1D4ED8" transform="rotate(45)"/>
    <use href="#teardropRay" fill="#38BDF8" transform="rotate(55)"/>
    <use href="#teardropRay" fill="#FBCFE8" transform="rotate(65)"/>
    <use href="#teardropRay" fill="#FB923C" transform="rotate(75)"/>
    <use href="#teardropRay" fill="#1D4ED8" transform="rotate(85)"/>
  </g>

  <!-- MUSTARD YELLOW ORGANIC CONTOUR LINE AURA -->
  <path d="M 100 700 Q 120 280 260 160 Q 500 80 740 160 Q 880 280 900 700 Z" 
        fill="none" stroke="#F59E0B" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- BLUE POLKA DOT AURA CONTOUR -->
  <path d="M 130 700 Q 150 310 280 190 Q 500 110 720 190 Q 850 310 870 700 Z" 
        fill="url(#auraDots)" stroke="#1D4ED8" stroke-width="4"/>

  <!-- CORAL STRIPED INNER AURA -->
  <path d="M 160 700 Q 180 340 300 230 Q 500 150 700 230 Q 820 340 840 700 Z" 
        fill="url(#coralStripes)" stroke="#FFFFFF" stroke-width="8"/>

  <!-- B&W EDITORIAL PHOTOGRAPHY BASE (Diverse Group of Female Friends) -->
  <g filter="url(#bwEditorialFilter)">
    <!-- Friend 1: Straight Dark Hair (Left) -->
    <image href="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" 
           x="160" y="200" width="220" height="380" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipFriend1)"/>
    
    <!-- Friend 2: Voluminous Curly Afro Coils (Center Stage) -->
    <image href="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=500&q=80" 
           x="370" y="150" width="260" height="420" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipFriend2)"/>

    <!-- Friend 3: Stylish Braids / Bob (Right) -->
    <image href="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80" 
           x="620" y="200" width="220" height="380" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipFriend3)"/>
  </g>

  <!-- HAND-DRAWN POP-ART GRAPHIC OVERLAYS (Clothes, Eyebrows, Star Eyes & Stripes) -->

  <!-- Friend 1 (Straight Hair Left) Hand-Drawn Hoodie & Makeup -->
  <path d="M 190 380 Q 270 360 340 390 L 360 620 L 170 620 Z" fill="url(#polkaBluePink)" opacity="0.9"/>
  <!-- Doodle Eyebrows & Star Eyes -->
  <path d="M 235 280 Q 250 270 265 280" stroke="#1D4ED8" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 285 280 Q 300 270 315 280" stroke="#1D4ED8" stroke-width="6" fill="none" stroke-linecap="round"/>
  <polygon points="250,305 253,312 260,313 255,318 257,325 250,321 243,325 245,318 240,313 247,312" fill="#F43F5E"/>
  <polygon points="300,305 303,312 310,313 305,318 307,325 300,321 293,325 295,318 290,313 297,312" fill="#F43F5E"/>

  <!-- Friend 2 (Curly Afro Center) Hand-Drawn Jacket & Cheek Stripes -->
  <path d="M 390 340 Q 500 310 610 340 L 630 680 L 370 680 Z" fill="url(#polkaYellowBlue)" opacity="0.95"/>
  <path d="M 410 360 L 440 500 L 500 680" stroke="#F43F5E" stroke-width="7" fill="none"/>
  <path d="M 590 360 L 560 500 L 500 680" stroke="#F43F5E" stroke-width="7" fill="none"/>
  <!-- Bold Eyebrows -->
  <path d="M 440 230 Q 465 215 490 230" stroke="#1D4ED8" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 510 230 Q 535 215 560 230" stroke="#1D4ED8" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Cheek Sunburst Stripes -->
  <line x1="435" y1="265" x2="435" y2="285" stroke="#F43F5E" stroke-width="4"/>
  <line x1="443" y1="265" x2="443" y2="288" stroke="#F43F5E" stroke-width="4"/>
  <line x1="451" y1="265" x2="451" y2="285" stroke="#F43F5E" stroke-width="4"/>
  <line x1="545" y1="265" x2="545" y2="285" stroke="#F43F5E" stroke-width="4"/>
  <line x1="553" y1="265" x2="553" y2="288" stroke="#F43F5E" stroke-width="4"/>
  <line x1="561" y1="265" x2="561" y2="285" stroke="#F43F5E" stroke-width="4"/>

  <!-- Friend 3 (Braids Right) Hand-Drawn Hoodie & Star Eyes -->
  <path d="M 640 380 Q 710 360 780 390 L 800 620 L 620 620 Z" fill="url(#polkaBluePink)" opacity="0.9"/>
  <polygon points="680,305 683,312 690,313 685,318 687,325 680,321 673,325 675,318 670,313 677,312" fill="#F59E0B"/>
  <polygon points="730,305 733,312 740,313 735,318 737,325 730,321 723,325 725,318 720,313 727,312" fill="#F59E0B"/>

  <!-- Foreground Caption Sticker Badge -->
  <g transform="translate(340, 650)">
    <rect x="0" y="0" width="320" height="60" rx="30" fill="#FFFFFF" stroke="#09090B" stroke-width="4" shadow-sm="true"/>
    <text x="32" y="38" font-family="Syne, sans-serif" font-size="20" font-weight="800" fill="#09090B">AMIGA DIVERSE SQUAD 💕</text>
  </g>
</svg>
