<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="lisbonPaperPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#FFF3E0"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FFE0B2" stroke-width="1.5"/>
    </pattern>
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#2C221E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#lisbonPaperPattern)" />

  <rect x="340" y="15" width="120" height="28" fill="#E65100" opacity="0.8" transform="rotate(-3 400 30)"/>

  <!-- Boarding Pass Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(140, 60) rotate(-6)">
    <rect x="0" y="0" width="340" height="140" rx="14" fill="#FFFFFF" stroke="#FB8C00" stroke-width="6"/>
    <line x1="240" y1="0" x2="240" y2="140" stroke="#FB8C00" stroke-width="3" stroke-dasharray="6,6"/>
    <text x="30" y="45" font-family="Outfit, sans-serif" font-size="24" font-weight="900" fill="#E65100">DUB ✈️ LIS</text>
    <text x="30" y="80" font-family="Caveat, cursive" font-size="26" font-weight="bold" fill="#2C221E">Lisbon Girls Long Weekend</text>
    <text x="30" y="110" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="600" fill="#6C5E58">Direct Aer Lingus • Gate 14</text>
  </g>

  <!-- Pastéis de Belém Tarts & Azulejo Tiles Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(140, 240) rotate(4)">
    <rect x="-10" y="-10" width="300" height="220" rx="20" fill="#FFFFFF"/>
    <!-- Azulejo Tile -->
    <rect x="20" y="20" width="240" height="160" rx="10" fill="#1976D2"/>
    <rect x="30" y="30" width="220" height="140" fill="#FFFFFF"/>
    <!-- Tart -->
    <ellipse cx="90" cy="100" rx="40" ry="30" fill="#F9E076" stroke="#E65100" stroke-width="4"/>
    <ellipse cx="90" cy="100" rx="25" ry="18" fill="#E65100"/>
    <ellipse cx="190" cy="100" rx="40" ry="30" fill="#F9E076" stroke="#E65100" stroke-width="4"/>
    <ellipse cx="190" cy="100" rx="25" ry="18" fill="#E65100"/>
  </g>

  <!-- Sunglasses Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(480, 260) rotate(-10)">
    <rect x="-10" y="-10" width="220" height="110" rx="16" fill="#FFFFFF"/>
    <rect x="20" y="30" width="70" height="45" rx="10" fill="#2C221E"/>
    <rect x="110" y="30" width="70" height="45" rx="10" fill="#2C221E"/>
    <line x1="90" y1="45" x2="110" y2="45" stroke="#2C221E" stroke-width="6"/>
  </g>

  <g transform="translate(240, 500)">
    <rect x="0" y="0" width="350" height="60" rx="12" fill="#FFFFFF" opacity="0.95"/>
    <text x="20" y="36" font-family="Caveat, cursive" font-size="24" font-weight="bold" fill="#E65100">Lisbon Sun &amp; Pastéis ✈️🇵🇹</text>
  </g>
</svg>
