<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="concertPaperPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#FFF3E0"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FFE0B2" stroke-width="1.5"/>
    </pattern>
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#2C221E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#concertPaperPattern)" />

  <rect x="340" y="15" width="120" height="28" fill="#E65100" opacity="0.8" transform="rotate(4 400 30)"/>

  <!-- Acoustic Guitar Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(120, 60) rotate(-15)">
    <rect x="-10" y="-10" width="180" height="420" rx="20" fill="#FFFFFF"/>
    <!-- Guitar Body -->
    <ellipse cx="80" cy="260" rx="70" ry="85" fill="#E65100"/>
    <ellipse cx="80" cy="170" rx="55" ry="60" fill="#E65100"/>
    <circle cx="80" cy="180" r="22" fill="#2C221E" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Neck -->
    <rect x="70" y="30" width="20" height="120" fill="#6C5E58"/>
    <rect x="62" y="15" width="36" height="30" rx="4" fill="#2C221E"/>
  </g>

  <!-- Ticket to Club Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(360, 80) rotate(8)">
    <rect x="0" y="0" width="240" height="110" rx="12" fill="#FF1493" stroke="#FFFFFF" stroke-width="6"/>
    <line x1="50" y1="0" x2="50" y2="110" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="6,6"/>
    <text x="75" y="48" font-family="Outfit, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">Whelan’s Live 🎸</text>
    <text x="75" y="78" font-family="Caveat, cursive" font-size="26" font-weight="bold" fill="#F9E076">Front Balcony Table</text>
  </g>

  <!-- Headphones & Camera Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(340, 240) rotate(-4)">
    <rect x="-10" y="-10" width="280" height="180" rx="20" fill="#FFFFFF"/>
    <path d="M 40 120 C 40 40, 180 40, 180 120" fill="none" stroke="#6C5E58" stroke-width="12"/>
    <rect x="25" y="100" width="30" height="45" rx="8" fill="#2C221E"/>
    <rect x="165" y="100" width="30" height="45" rx="8" fill="#2C221E"/>
  </g>

  <g transform="translate(260, 500)">
    <rect x="0" y="0" width="360" height="60" rx="12" fill="#FFFFFF" opacity="0.95"/>
    <text x="20" y="36" font-family="Caveat, cursive" font-size="24" font-weight="bold" fill="#E65100">Whelan’s Acoustic Live Night 🎸</text>
  </g>
</svg>
