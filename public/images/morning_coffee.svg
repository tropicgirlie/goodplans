<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="coffeePaperPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#FAF6F0"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#F3ECE0" stroke-width="1.5"/>
    </pattern>
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#2C221E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#coffeePaperPattern)" />

  <rect x="340" y="15" width="120" height="28" fill="#9E8E87" opacity="0.8" transform="rotate(2 400 30)"/>

  <!-- Coffee Latte Cup with Heart Latte Art Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(180, 80) rotate(-4)">
    <rect x="-10" y="-10" width="200" height="200" rx="20" fill="#FFFFFF"/>
    <circle cx="90" cy="90" r="70" fill="#FFFFFF" stroke="#9E8E87" stroke-width="4"/>
    <circle cx="90" cy="90" r="58" fill="#6C5E58"/>
    <path d="M 90 75 C 75 55, 60 75, 90 110 C 120 75, 105 55, 90 75 Z" fill="#FAF6F0"/>
  </g>

  <!-- Cardamom Buns Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(420, 90) rotate(5)">
    <rect x="-10" y="-10" width="200" height="180" rx="20" fill="#FFFFFF"/>
    <circle cx="90" cy="80" r="55" fill="#E0D4C5" stroke="#9E8E87" stroke-width="4"/>
    <path d="M 60 80 Q 90 40 120 80 Q 90 120 60 80 Z" fill="#9E8E87"/>
    <text x="35" y="155" font-family="Caveat, cursive" font-size="20" font-weight="bold" fill="#2C221E">Fresh Cardamom Bun</text>
  </g>

  <!-- Stroller & Park Bench Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(200, 310) rotate(-2)">
    <rect x="-10" y="-10" width="380" height="170" rx="20" fill="#FFFFFF"/>
    <!-- Stroller -->
    <path d="M 40 50 A 35 35 0 0 1 100 50 L 100 100 L 40 100 Z" fill="#7B9E87"/>
    <circle cx="50" cy="115" r="14" fill="#2C221E"/>
    <circle cx="90" cy="115" r="14" fill="#2C221E"/>
    <line x1="100" y1="50" x2="130" y2="20" stroke="#6C5E58" stroke-width="6"/>
    <!-- Park Bench -->
    <rect x="180" y="70" width="160" height="12" fill="#6C5E58"/>
    <rect x="180" y="90" width="160" height="12" fill="#6C5E58"/>
    <line x1="200" y1="102" x2="200" y2="135" stroke="#2C221E" stroke-width="6"/>
    <line x1="320" y1="102" x2="320" y2="135" stroke="#2C221E" stroke-width="6"/>
  </g>

  <g transform="translate(240, 500)">
    <rect x="0" y="0" width="340" height="60" rx="12" fill="#FFFFFF" opacity="0.95"/>
    <text x="20" y="36" font-family="Caveat, cursive" font-size="24" font-weight="bold" fill="#6C5E58">Ranelagh Maternity Morning ☕👶</text>
  </g>
</svg>
