<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="naturePaperPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#F4F8F4"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#E2EBE2" stroke-width="1.5"/>
    </pattern>
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#2C221E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#naturePaperPattern)" />

  <!-- Tape -->
  <rect x="340" y="15" width="120" height="28" fill="#7B9E87" opacity="0.8" transform="rotate(3 400 30)"/>

  <!-- Oil Mountain Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(140, 50) rotate(-2)">
    <rect x="-10" y="-10" width="520" height="280" rx="20" fill="#FFFFFF"/>
    <path d="M 0 200 L 120 40 L 240 160 L 360 20 L 500 260 L 0 260 Z" fill="#7B9E87"/>
    <path d="M 120 40 L 160 120 L 240 160 Z" fill="#A3C1AD"/>
    <path d="M 360 20 L 410 100 L 500 260 Z" fill="#95B6A0"/>
    <path d="M 0 180 Q 250 140 500 220 L 500 260 L 0 260 Z" fill="#D8E8DC"/>
  </g>

  <!-- Paintbrushes in Terracotta Pot Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(80, 240) rotate(-8)">
    <rect x="-10" y="-10" width="140" height="200" rx="16" fill="#FFFFFF"/>
    <!-- Pot -->
    <path d="M 20 100 L 30 170 L 90 170 L 100 100 Z" fill="#C85A65"/>
    <!-- Brushes -->
    <line x1="35" y1="100" x2="20" y2="20" stroke="#9E8E87" stroke-width="6"/>
    <polygon points="15,20 25,20 20,5" fill="#F9E076"/>
    <line x1="60" y1="100" x2="60" y2="10" stroke="#9E8E87" stroke-width="8"/>
    <polygon points="52,10 68,10 60,-5" fill="#7B9E87"/>
    <line x1="85" y1="100" x2="95" y2="25" stroke="#9E8E87" stroke-width="6"/>
    <polygon points="90,25 100,25 95,10" fill="#C85A65"/>
  </g>

  <!-- Stacked Ceramic Teacups Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(180, 360) rotate(6)">
    <rect x="-10" y="-10" width="130" height="150" rx="16" fill="#FFFFFF"/>
    <path d="M 10 90 L 20 130 L 80 130 L 90 90 Z" fill="#F7B7A3"/>
    <path d="M 20 50 L 30 90 L 80 90 L 90 50 Z" fill="#F9E076"/>
    <path d="M 25 10 L 35 50 L 75 50 L 85 10 Z" fill="#7B9E87"/>
  </g>

  <!-- Quote Cutout Sticker: You're it, you're my person -->
  <g filter="url(#stickerShadow)" transform="translate(460, 80) rotate(5)">
    <rect x="0" y="0" width="260" height="60" rx="30" fill="#FFFFFF"/>
    <text x="30" y="38" font-family="Caveat, cursive" font-size="24" font-weight="bold" fill="#2C221E">"You're it, you're my person" 🌿</text>
  </g>

  <!-- Monarch Butterfly Cutout -->
  <g filter="url(#stickerShadow)" transform="translate(480, 320) rotate(-12)">
    <ellipse cx="40" cy="40" rx="35" ry="25" fill="#E65100" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="40" cy="40" r="6" fill="#2C221E"/>
  </g>

  <!-- Record CD: Meaning of Life -->
  <g filter="url(#stickerShadow)" transform="translate(600, 400) rotate(15)">
    <circle cx="60" cy="60" r="55" fill="#FFFFFF"/>
    <circle cx="60" cy="60" r="50" fill="#E0D4C5"/>
    <circle cx="60" cy="60" r="18" fill="#F9E076"/>
    <circle cx="60" cy="60" r="6" fill="#2C221E"/>
    <text x="30" y="105" font-family="Caveat, cursive" font-size="14" font-weight="bold" fill="#2C221E">Meaning of life</text>
  </g>

  <!-- Bottom Handwritten Caption -->
  <g transform="translate(320, 500)">
    <rect x="0" y="0" width="340" height="60" rx="12" fill="#FFFFFF" opacity="0.95"/>
    <text x="20" y="36" font-family="Caveat, cursive" font-size="24" font-weight="bold" fill="#7B9E87">Wicklow Mountain Spa Retreat 🌿</text>
  </g>
</svg>
