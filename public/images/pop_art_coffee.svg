<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="bwFilter">
      <feColorMatrix type="matrix" values="
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0    0    0    1 0"/>
    </filter>

    <pattern id="polkaMustard" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#F59E0B"/>
      <circle cx="10" cy="10" r="5" fill="#2563EB"/>
    </pattern>

    <g id="teardropRay">
      <path d="M 0 -180 Q -12 -140 0 -100 Q 12 -140 0 -180 Z" />
    </g>
  </defs>

  <rect width="800" height="600" fill="#FAFAFA"/>

  <!-- Radiating Teardrops -->
  <g transform="translate(400, 300)">
    <use href="#teardropRay" fill="#F59E0B" transform="rotate(-60)"/>
    <use href="#teardropRay" fill="#2563EB" transform="rotate(-30)"/>
    <use href="#teardropRay" fill="#F43F5E" transform="rotate(0)"/>
    <use href="#teardropRay" fill="#F59E0B" transform="rotate(30)"/>
    <use href="#teardropRay" fill="#2563EB" transform="rotate(60)"/>
  </g>

  <!-- Mustard Aura -->
  <path d="M 140 540 Q 160 200 400 130 Q 640 200 660 540 Z" fill="none" stroke="#F59E0B" stroke-width="18"/>

  <!-- B&W Coffee Walk Photo -->
  <g filter="url(#bwFilter)">
    <image href="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" 
           x="200" y="170" width="400" height="330" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Pop-Art Scarf & Latte Art Cutout -->
  <path d="M 240 340 Q 400 310 560 340 L 580 480 L 220 480 Z" fill="url(#polkaMustard)" opacity="0.9"/>

  <!-- Latte Cup Sticker -->
  <g transform="translate(460, 90) rotate(6)">
    <circle cx="50" cy="50" r="45" fill="#FFFFFF" stroke="#09090B" stroke-width="4"/>
    <circle cx="50" cy="50" r="36" fill="#78350F"/>
    <path d="M 50 38 C 40 25, 30 38, 50 62 C 70 38, 60 25, 50 38 Z" fill="#FFFFFF"/>
  </g>

  <!-- Caption -->
  <g transform="translate(240, 510)">
    <rect x="0" y="0" width="320" height="55" rx="28" fill="#FFFFFF" stroke="#09090B" stroke-width="3"/>
    <text x="25" y="35" font-family="Syne, sans-serif" font-size="18" font-weight="800" fill="#09090B">MORNING COFFEE &amp; STROLL ☕</text>
  </g>
</svg>
