<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="bwFilter">
      <feColorMatrix type="matrix" values="
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0    0    0    1 0"/>
    </filter>

    <pattern id="polkaBlue" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#1D4ED8"/>
      <circle cx="10" cy="10" r="5" fill="#F59E0B"/>
    </pattern>

    <g id="teardropRay">
      <path d="M 0 -180 Q -12 -140 0 -100 Q 12 -140 0 -180 Z" />
    </g>
  </defs>

  <rect width="800" height="600" fill="#FAFAFA"/>

  <!-- Radiating Teardrops -->
  <g transform="translate(400, 300)">
    <use href="#teardropRay" fill="#F43F5E" transform="rotate(-60)"/>
    <use href="#teardropRay" fill="#1D4ED8" transform="rotate(-30)"/>
    <use href="#teardropRay" fill="#F59E0B" transform="rotate(0)"/>
    <use href="#teardropRay" fill="#F43F5E" transform="rotate(30)"/>
    <use href="#teardropRay" fill="#1D4ED8" transform="rotate(60)"/>
  </g>

  <!-- Mustard Contour -->
  <path d="M 140 540 Q 160 200 400 130 Q 640 200 660 540 Z" fill="none" stroke="#F59E0B" stroke-width="18"/>

  <!-- B&W Concert Photo -->
  <g filter="url(#bwFilter)">
    <image href="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80" 
           x="200" y="170" width="400" height="330" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Pop-Art Headphones & Ticket Overlay -->
  <path d="M 280 230 C 280 140, 520 140, 520 230" fill="none" stroke="#F43F5E" stroke-width="14"/>
  <rect x="255" y="210" width="35" height="50" rx="8" fill="#1D4ED8"/>
  <rect x="510" y="210" width="35" height="50" rx="8" fill="#1D4ED8"/>

  <!-- Star Eyes -->
  <polygon points="340,275 343,282 350,283 345,288 347,295 340,291 333,295 335,288 330,283 337,282" fill="#F59E0B"/>
  <polygon points="440,275 443,282 450,283 445,288 447,295 440,291 433,295 435,288 430,283 437,282" fill="#F59E0B"/>

  <!-- Ticket Sticker Cutout -->
  <g transform="translate(460, 80) rotate(10)">
    <rect x="0" y="0" width="180" height="75" rx="10" fill="#F43F5E" stroke="#FFFFFF" stroke-width="4"/>
    <text x="25" y="44" font-family="Syne, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">LIVE CONCERT 🎸</text>
  </g>

  <!-- Caption -->
  <g transform="translate(250, 510)">
    <rect x="0" y="0" width="300" height="55" rx="28" fill="#FFFFFF" stroke="#09090B" stroke-width="3"/>
    <text x="35" y="35" font-family="Syne, sans-serif" font-size="18" font-weight="800" fill="#09090B">WHELAN’S LIVE GIG 🎤</text>
  </g>
</svg>
