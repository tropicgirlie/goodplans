<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="bwFilter">
      <feColorMatrix type="matrix" values="
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0    0    0    1 0"/>
    </filter>

    <pattern id="polkaCoral" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#F43F5E"/>
      <circle cx="10" cy="10" r="5" fill="#FFFFFF"/>
    </pattern>

    <g id="teardropRay">
      <path d="M 0 -180 Q -12 -140 0 -100 Q 12 -140 0 -180 Z" />
    </g>
  </defs>

  <rect width="800" height="600" fill="#FAFAFA"/>

  <!-- Radiating Teardrop Rays -->
  <g transform="translate(400, 300)">
    <use href="#teardropRay" fill="#1D4ED8" transform="rotate(-70)"/>
    <use href="#teardropRay" fill="#F43F5E" transform="rotate(-50)"/>
    <use href="#teardropRay" fill="#F59E0B" transform="rotate(-30)"/>
    <use href="#teardropRay" fill="#1D4ED8" transform="rotate(-10)"/>
    <use href="#teardropRay" fill="#F43F5E" transform="rotate(10)"/>
    <use href="#teardropRay" fill="#F59E0B" transform="rotate(30)"/>
    <use href="#teardropRay" fill="#1D4ED8" transform="rotate(50)"/>
    <use href="#teardropRay" fill="#F43F5E" transform="rotate(70)"/>
  </g>

  <!-- Mustard Aura Line -->
  <path d="M 120 540 Q 140 200 400 120 Q 660 200 680 540 Z" fill="none" stroke="#F59E0B" stroke-width="18"/>

  <!-- B&W Dinner Scene Photo -->
  <g filter="url(#bwFilter)">
    <image href="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80" 
           x="180" y="160" width="440" height="340" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Pop-Art Overlay Clothing & Wine Glasses -->
  <path d="M 220 340 L 320 300 L 400 480 L 180 480 Z" fill="url(#polkaCoral)" opacity="0.9"/>
  <!-- Wine Glasses & Pasta Pop-Art Cutouts -->
  <path d="M 460 380 Q 480 340 500 380 Z" fill="#F43F5E" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="480" y1="380" x2="480" y2="420" stroke="#FFFFFF" stroke-width="5"/>

  <!-- Caption -->
  <g transform="translate(250, 510)">
    <rect x="0" y="0" width="300" height="55" rx="28" fill="#FFFFFF" stroke="#09090B" stroke-width="3"/>
    <text x="25" y="35" font-family="Syne, sans-serif" font-size="18" font-weight="800" fill="#09090B">EARLY DINNER &amp; WINE 🍷</text>
  </g>
</svg>
