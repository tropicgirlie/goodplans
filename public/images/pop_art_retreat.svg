<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="bwFilter">
      <feColorMatrix type="matrix" values="
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0    0    0    1 0"/>
    </filter>

    <pattern id="polkaGreen" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#059669"/>
      <circle cx="10" cy="10" r="5" fill="#FFFFFF"/>
    </pattern>

    <g id="teardropRay">
      <path d="M 0 -180 Q -12 -140 0 -100 Q 12 -140 0 -180 Z" />
    </g>
  </defs>

  <rect width="800" height="600" fill="#FAFAFA"/>

  <!-- Botanical Teardrops -->
  <g transform="translate(400, 300)">
    <use href="#teardropRay" fill="#059669" transform="rotate(-60)"/>
    <use href="#teardropRay" fill="#F59E0B" transform="rotate(-30)"/>
    <use href="#teardropRay" fill="#1D4ED8" transform="rotate(0)"/>
    <use href="#teardropRay" fill="#059669" transform="rotate(30)"/>
    <use href="#teardropRay" fill="#F59E0B" transform="rotate(60)"/>
  </g>

  <!-- Mustard Aura -->
  <path d="M 140 540 Q 160 200 400 130 Q 640 200 660 540 Z" fill="none" stroke="#F59E0B" stroke-width="18"/>

  <!-- B&W Spa/Nature Photo -->
  <g filter="url(#bwFilter)">
    <image href="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=600&q=80" 
           x="200" y="170" width="400" height="330" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Robe Overlay -->
  <path d="M 230 350 L 330 310 L 400 500 L 190 500 Z" fill="url(#polkaGreen)" opacity="0.9"/>

  <!-- Sticker Cutout -->
  <g transform="translate(440, 80) rotate(8)">
    <rect x="0" y="0" width="220" height="70" rx="35" fill="#059669" stroke="#FFFFFF" stroke-width="4"/>
    <text x="25" y="42" font-family="Caveat, cursive" font-size="24" font-weight="bold" fill="#FFFFFF">You're it, my person 🌿</text>
  </g>

  <!-- Caption -->
  <g transform="translate(240, 510)">
    <rect x="0" y="0" width="320" height="55" rx="28" fill="#FFFFFF" stroke="#09090B" stroke-width="3"/>
    <text x="30" y="35" font-family="Syne, sans-serif" font-size="18" font-weight="800" fill="#09090B">WICKLOW SPA RETREAT 🌿</text>
  </g>
</svg>
